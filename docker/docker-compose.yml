# The obsolete top-level `version:` key was removed — Compose v2 warns on it.
services:
  db:
    image: postgres:15-alpine
    container_name: aronofy_db
    restart: always
    environment:
      POSTGRES_DB: aronofy_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aronofy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aronofy_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: docker/app.dockerfile
    container_name: aronofy_api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      # Only the upload directory is persisted. The source tree is no longer
      # bind-mounted over the image: that shadowed the built application, so the
      # container behaved differently from a real deployment.
      - uploads_data:/workspace/uploads
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/aronofy_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      # Supplied by the deployment environment. Deliberately no default: a
      # hardcoded JWT secret in source control is a signing-key leak.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-http://localhost:5173}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/live').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/worker.dockerfile
    container_name: aronofy_worker
    restart: always
    volumes:
      - uploads_data:/workspace/uploads
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/aronofy_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Waits for the API to become healthy, which happens only after it has
      # applied migrations — so the worker never queries a missing schema.
      web:
        condition: service_healthy

  beat:
    build:
      context: ..
      dockerfile: docker/worker.dockerfile
    container_name: aronofy_beat
    restart: always
    # Beat only emits schedule ticks; it needs no uploads volume.
    command: celery -A app.worker.celery_app.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/aronofy_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Waits for the API to become healthy, which happens only after it has
      # applied migrations — so the worker never queries a missing schema.
      web:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
